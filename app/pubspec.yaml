name: goat_app
description: "Goat (Козёл) — online multiplayer card game."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  go_router: ^16.0.0
  web_socket_channel: ^3.0.1
  msgpack_dart: ^1.0.1
  shared_preferences: ^2.3.0
  http: ^1.2.0
  clock: ^1.1.1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # Monochrome subset of the reaction/achievement emoji (tools/subset_emoji.py)
    # so web renders them offline instead of downloading Noto from gstatic.
    - family: NotoEmoji
      fonts:
        - asset: assets/fonts/NotoEmojiSubset.ttf
